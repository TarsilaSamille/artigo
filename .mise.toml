[tools]
python = "3.12"

[tasks.install-deps]
description = "Install Python dependencies for rendering"
run = "pip install playwright"

[tasks.render-arch]
description = "Render architecture diagram to high-res image"
run = "python render_mmd_highres.py"
depends = ["install-deps"]

[tasks.build]
description = "Compile LaTeX document"
run = "latexmk -pdf -interaction=nonstopmode main.tex"

[tasks.dev]
description = "Watch and compile LaTeX document on changes"
run = "latexmk -pdf -interaction=nonstopmode -pvc main.tex"

[tasks.clean]
description = "Clean LaTeX auxiliary files"
run = "latexmk -c"
